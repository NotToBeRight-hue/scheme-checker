spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/schemes}
    username: ${DB_USER:schemes_app}
    password: ${DB_PASSWORD:change_me_locally}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080

app:
  jwt-secret: ${JWT_SECRET}



debug: false
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: INFO
    org.hibernate.SQL: INFO
