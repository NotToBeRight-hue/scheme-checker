<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Government Scheme Selector</title><script>try{var theme=localStorage.getItem("theme");document.documentElement.dataset.theme=theme==="light"||theme==="dark"?theme:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}catch(e){document.documentElement.dataset.theme="light";}</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
